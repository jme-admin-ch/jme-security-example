server:
  port: 8080

frontend:
  origin: http://localhost:${server.port}
  authority: ${jeap.security.oauth2.resourceserver.authorization-server.issuer}
  applicationUrl: http://localhost:8080/jme-security-scs/
  logoutRedirectUri: http://localhost:4199/
  useAutoLogin: false
  redirectUrl: "${frontend.applicationUrl}redirect"

jeap:
  security:
    oauth2:
      resourceserver:
        # Only accept access tokens that explicitly address this resource (resource id contained in the 'aud' claim),
        # i.e. reject tokens in the USER and SYS contexts that do not specify an audience.
        strict-audience-validation: on
        authorization-server:
          issuer: "http://localhost:8081/jme-security-auth-scs"
          jwk-set-uri: "${jeap.security.oauth2.resourceserver.authorization-server.issuer}/.well-known/jwks.json"
  web:
    headers:
      content-security-policy: "default-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8081 https://icanhazdadjoke.com; style-src 'self' 'unsafe-inline'; frame-src 'self' http://localhost:8081; frame-ancestors 'self';"
