server:
  port: 8889

jeap:
  security:
    oauth2:
      resourceserver:
        system-name: jme

        authorization-server:
          issuer: http://localhost:8890/security-ui-oidc-mock
          jwk-set-uri: >-
            http://localhost:8890/security-ui-oidc-mock/.well-known/jwks.json

        log:
          authentication-failure:
            enabled: true
          access-denied:
            enabled: true
            debug: true

        introspection:
          mode: none

  web:
    headers:
      content-security-policy: "default-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8890 https://icanhazdadjoke.com; style-src 'self' 'unsafe-inline'; frame-src 'self' http://localhost:8890; frame-ancestors 'self';"
    tls:
      enabled: false

frontend:
  origin: http://localhost:8889

  authority: >-
    ${jeap.security.oauth2.resourceserver.authorization-server.issuer}

  application-url: >-
    http://localhost:8889${server.servlet.context-path}/

  logout-redirect-uri: >-
    http://localhost:8889${server.servlet.context-path}/

  redirect-url: >-
    http://localhost:8889${server.servlet.context-path}/redirect

  client-id: jme-security-scs

  use-auto-login: true

  token-aware-patterns:
    - "^${server.servlet.context-path}/api/.*"
    - "^http://localhost:8889${server.servlet.context-path}/api/.*"
    - "^${server.servlet.context-path}/ui-api/.*"
    - "^http://localhost:8889${server.servlet.context-path}/ui-api/.*"

logging:
  level:
    ch.admin.bit.jeap.security.resource.log: DEBUG
    ch.admin.bit.jeap.log.RestRequestTracer: DEBUG
    org.springframework.security: INFO
    org.zalando: INFO
