# Activate this profile in addition to the 'local' profile (-Dspring-boot.run.profiles=local,local-legacy-aud-check)
# to have the OAuth mock server issue access tokens WITHOUT an audience ('aud' claim) and not validate the audience on
# token introspection, as legacy authorization servers do. Together with the 'local-legacy-aud-check' profiles of the
# resource servers of this example, which switch the strict audience validation off, this runs the example with the
# legacy, non-strict audience check: a token without an audience is then considered valid for every resource.
#
mockserver:
  # Legacy authorization servers do not validate the audience on token introspection (the tokens issued with this
  # profile do not even carry one) -> switching the audience check of the introspection endpoint off.
  introspection-endpoint-audience-check: "off"

# Tthe client list below replaces the client list of the 'local' profile. It repeats the clients of the
# 'local' profile, just without their 'audience' property.
oauth-mock-data:
  clients:

    - client-id: "jme-security-ui"
      context: "USER"
      registered-redirect-uri:
        - "http://localhost:8080/jme-security-scs/redirect"
        - "http://localhost:8080/jme-security-scs/assets/auth/silent-renew.html"
        - "http://localhost:4200/redirect"
        - "http://localhost:4200/assets/auth/silent-renew.html"
      bproles:
        "11111": ["jme_@partner_#read", "jme_@thing_#read"]
        "22222": ["jme_@partner_#read", "jme_@thing_#read"]
        "99999": ["jme_@partner_#read", "jme_@thing_#read"]

    - client-id: "jme-security-ui-alternate-roles"
      context: "USER"
      registered-redirect-uri:
        - "http://localhost:8080/jme-security-scs/redirect"
        - "http://localhost:8080/jme-security-scs/assets/auth/silent-renew.html"
        - "http://localhost:4200/redirect"
        - "http://localhost:4200/assets/auth/silent-renew.html"
      bproles:
        "11111": ["jme_@partner_!read", "jme_@thing_!read"]
        "22222": ["jme_@partner_!read", "jme_@thing_!read"]
        "99999": ["jme_@partner_!read", "jme_@thing_!read"]

    - client-id: "jme-security-ui-bpscoped"
      bproles-scope-enabled: true
      context: "USER"
      registered-redirect-uri:
        - "http://localhost:8080/jme-security-scs/redirect"
        - "http://localhost:8080/jme-security-scs/assets/auth/silent-renew.html"
        - "http://localhost:4200/redirect"
        - "http://localhost:4200/assets/auth/silent-renew.html"
      bproles:
        "11111": ["jme_@partner_#read", "jme_@thing_#read"]
        "22222": ["jme_@partner_#read", "jme_@thing_#read"]
        "99999": ["jme_@partner_#read", "jme_@thing_#read"]

    - client-id: "jme-security-client-service"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles: ["jme_@partner_#read", "jme_@thing_#read"]

    - client-id: "jme-security-client-service-alternate-roles"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles: ["jme_@partner_!read", "jme_@thing_!read"]

    - client-id: "jme-security-client-service-roles-pruned"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles: ["jme_@partner_#read", "jme_@thing_#read",
                  # Additional roles that are not used but just meant to increase the token size
                  "jme_@some-resource-1_#some-operation-1", "jme_@some-resource-1_#some-operation-2",
                  "jme_@some-resource-2_#some-operation-1","jme_@some-resource-2_#some-operation-2"]
      # Don't embed the userroles and bproles claims in the token if the accumulated roles sizes exceed the roles-pruning-limit
      roles-pruning-enabled: true

    - client-id: "jme-security-client-service-bpscoped"
      bproles-scope-enabled: true
      client-secret: "{noop}secret"
      context: "SYS"
      bproles:
        "11111": [ "jme_@partner_#read", "jme_@thing_#read" ]
        "22222": [ "jme_@foo_#bar" ]

    # Client used by the jme-security-resource-service for accessing the token introspection endpoint. Doesn't need
    # any roles.
    - client-id: "jme-security-resource-service"
      client-secret: "{noop}secret"
      context: "SYS"

    # Client used for impersonating a user via the modified direct access grant. Doesn't need any roles.
    - client-id: "jme-security-client-service-direct-access-user"
      client-secret: "{noop}direct-access-user-secret"
      context: "SYS"
