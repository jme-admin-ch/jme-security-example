server:
  port: 8060

jeap:
  security:
    oauth2:
      resourceserver:
        log:
          authentication-failure:
            enabled: true
          access-denied:
            enabled: true
            debug: true
        # This service plays the role of a man-in-the-middle and as such simply re-uses the resource id of the
        # jme-security-resource-service so the client service can simply address one audience.
        resource-id: "jme-security-resource-service"
        # Only accept access tokens that explicitly address this resource (resource id contained in the 'aud' claim),
        # i.e. reject tokens in the USER and SYS contexts that do not specify an audience.
        strict-audience-validation: on
        authorization-server:
          issuer: "http://localhost:8081/jme-security-auth-scs"
          jwk-set-uri: "${jeap.security.oauth2.resourceserver.authorization-server.issuer}/.well-known/jwks.json"
logging:
  level:
    ch.admin.bit.jeap.security.resource.log: DEBUG

spring:
  security:
    oauth2:
      client:
        registration:
          jme-security-client-service:
            client-id: "jme-security-client-service"
            client-secret: "secret"
            authorization-grant-type: "client_credentials"
            provider: "local-mock"
          jme-security-client-service-alternate-roles:
            client-id: "jme-security-client-service-alternate-roles"
            client-secret: "secret"
            authorization-grant-type: "client_credentials"
            provider: "local-mock"
        provider:
          local-mock:
            issuer-uri: "${jeap.security.oauth2.resourceserver.authorization-server.issuer}"

jme:
  security:
    client:
      resource-url: "http://localhost:8070/jme-security-resource-service"
